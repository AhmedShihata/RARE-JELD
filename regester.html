<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register Form</title>
    <link rel="stylesheet" href="./style2.css">
</head>
<body>
    <div class="parent">
        <h2>Register Form</h2>
        <form id="registerForm">
            <div>
                <input id="namee" type="text" placeholder="Your Name" required>
            </div>
            <div>
                <input id="emaill" type="email" placeholder="Your Email" required>
            </div>
            <div>
                <input id="passwordd" type="password" placeholder="Your Password" required>
            </div>
            <div>
                <input id="submit" class="submit" type="submit">
            </div>
            <div id="link">
                <span>Do you have an account?</span> <a href="./login.html">Go Login</a>
            </div>
        </form>
    </div>




    <script src="script.js"></script>
</body>
</html>
